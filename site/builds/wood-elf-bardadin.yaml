meta:
  id: wood-elf-bardadin
  name: Wood Elf Bardadin
  tagline: Swords Bard 6 / Vengeance Paladin 6 — auto-crit smite fisher
  race: Wood Elf
  classes: [Bard, Paladin]
  level_range: "1 → 12"
  difficulty: Beginner-friendly
  final_split: Bard 6 / Paladin 6
  win_condition: >
    Hold Person → guaranteed crit melee → Divine Smite (smite dice double on crit).
    Round 1 set up the paralysis. Round 2 detonate the boss.

overview: |
  This is a charisma-based, dual-wielding melee/caster hybrid. You play it like a
  rogue or fighter most of the time — two daggers/shortswords, dancing in and out
  of melee — but you also have full Bard utility (Faerie Fire, Hold Person, Healing
  Word) and the Paladin's signature Divine Smite for nova-round burst damage.

  The trick that makes this build broken: paralyzed enemies always crit when struck
  in melee, and Smite damage doubles on a crit. So you Hold a target, then unload
  every spell slot you have as Smite damage, with the dice doubled. Add the **Band
  of the Mystic Scoundrel** in Act 3 (cast Hold Person as a bonus action after a
  weapon hit) and the loop becomes one-sided.

  **A note on the 6/6 split.** The community-meta Bardadin is Bard 10 / Paladin 2
  — that split unlocks Magical Secrets at Bard 10 (Banishing Smite, Counterspell)
  and gives more spell slots and Bardic Inspirations. This guide takes the 6/6
  Vengeance variant instead, which trades nova ceiling for **Aura of Protection**
  at Paladin 6 (+CHA modifier to all party saves within 9m) and Vow of Enmity /
  Inquisitor's Might from Vengeance 3. See the Reference → Alternative splits
  section for when you'd pick 10/2 instead.

character_creation:
  note: |
    If you're starting fresh, follow this. If you've already played a few levels in
    a different class, talk to Withers in camp (~100 gp) and respec to these picks.
  class: Bard
  background_suggested: Entertainer (gives Acrobatics + Performance proficiency)
  cantrips_at_l1: [Vicious Mockery, Friends]
  spells_known_at_l1: [Dissonant Whispers, Longstrider, Faerie Fire, Healing Word]
  ability_scores:
    note: "Buy these point-buy values. Wood Elf adds +2 DEX, +1 WIS automatically."
    str: 8
    dex: 15
    con: 14
    int: 8
    wis: 10
    cha: 15
  final_starting:
    str: 8
    dex: 17
    con: 14
    int: 8
    wis: 11
    cha: 15

skills:
  summary: |
    Skill picks are almost all decided at character creation. The only later
    decision is Expertise at Bard 3. After that, no new skill proficiencies
    appear — Bard 4–6 and Paladin 1–6 don't grant skills, and multiclassing
    into Paladin gives armor/weapon proficiencies but not skills.
  at_creation:
    from_race:
      pick: [Perception]
      note: Wood Elf grants Perception automatically. You don't choose it.
    from_background:
      pick: [Acrobatics, Performance]
      background: Entertainer
      note: |
        These come free with the Entertainer background. The game treats them as
        already-proficient, which is why the class skill screen will gray
        Performance out — you can't double-pick. That's fine, you already have it.
        If you'd rather pick Performance manually as a class skill, take a
        background that doesn't include it (e.g. Charlatan, Sage, Acolyte).
    from_class:
      pick: [Persuasion, Deception, Insight]
      note: |
        Bard picks 3 skill proficiencies from ANY skill in the game (most classes
        have a restricted list — Bard is special). Skip the two your background
        already covers. Persuasion + Deception are your CHA face skills;
        Insight (WIS) is for reading NPCs and lie detection.
        If your background is NOT Entertainer, swap Performance back in for one
        of these (Persuasion + Deception + Performance is the alternate set).
  at_level_3_expertise:
    pick: [Persuasion, Deception]
    note: |
      At Bard 3 you choose 2 skills to gain Expertise — your proficiency bonus is
      doubled on those skills. Pick the two CHA-based face skills you'll lean on
      every conversation. Performance is fine if you'd rather, but Persuasion +
      Deception cover almost every dialogue check in the game.
  later_levels: |
    Bard 4 → 6 grants no new skill proficiencies in BG3. Paladin 1 → 6 grants no
    skill proficiencies when multiclassing in (you only get skills from a class
    if you START in it). So your final list at L12 is:
      • Race: Perception
      • Background (Entertainer): Acrobatics, Performance
      • Class (Bard 1): Persuasion, Deception, Insight
      • Expertise (Bard 3): Persuasion, Deception (doubled)

stats_progression:
  priorities: [CHA, DEX, CON]
  asi_plan:
    - level: 10
      pick: "+2 CHA (15 → 17)"
      reason: Improves spell save DC, the Aura of Protection at L12, and any CHA-based ability check.
  alternates:
    - feat: Resilient (Constitution)
      when: "If you've struggled to keep Concentration on Hold Person before L12."
      tradeoff: "Loses the +2 CHA ramp. Aura of Protection at L12 mostly fixes Concentration on its own."
    - feat: Alert
      when: "If you find yourself surprised in ambushes or going late in initiative."
      tradeoff: "Pure utility. CHA stays at 15 for the rest of the run."
  permanent_boosts:
    note: |
      Two in-game items grant permanent stat upgrades. Spend both on CHA to push
      your final cap to 20 (or save Hag's Hair for elsewhere if you've already
      promised it to someone else).
    items:
      - { name: "Hag's Hair", grants: "+1 to one ability score (permanent)", where: "Auntie Ethel — earned by accepting her offer in the Sunlit Wetlands (Act 1).", recommend: "Spend on CHA — pushes 17 → 18." }
      - { name: "Mirror of Loss (boon)", grants: "+2 to one ability score (permanent), but −1 to all others until you Restore at the same shrine", where: "Gauntlet of Shar (Act 2). Pass the WIS check to gain the boon.", recommend: "Spend on CHA — pushes 18 → 20 if you took Hag's Hair on CHA." }
  cap_at_12:
    cha: 20
    dex: 17
    con: 14
    note: "Final cap assumes both Hag's Hair (+1 CHA) and Mirror of Loss (+2 CHA) are spent on Charisma plus the +2 CHA ASI at level 10."

leveling:
  - level: 1
    take: Bard 1
    pick:
      - Cantrips — Vicious Mockery, Friends
      - "Spells (4 known) — Dissonant Whispers, Longstrider, Faerie Fire, Healing Word"
      - 'Skill proficiencies (Bard picks 3 from ANY skill) — Persuasion, Deception, Insight. Skip Performance and Acrobatics: your background grants those for free, the screen will already show them as proficient with no checkbox.'
      - Bardic Inspiration (d6, CHA-mod uses per long rest)
    notes: |
      Stick to ranged early. Bard 1 has no Extra Attack and no subclass yet. Use
      Vicious Mockery for free disadvantage on enemy attacks. Save Inspiration for
      ally buffs (Inspiration die added to attack roll, ability check, or save).
      Equip a hand crossbow + finesse melee weapon for now.
  - level: 2
    take: Bard 2
    pick:
      - Jack of All Trades (½ proficiency on non-proficient ability checks)
      - Song of Rest (extra HP regen on short rests)
      - "Spell (gain 1) — pick Disguise Self (utility) or Thunderwave (small AoE)"
    notes: |
      A filler level — no dramatic new toys. Jack of All Trades quietly buffs
      every skill check you aren't proficient in. Keep playing back-line until
      Bard 3 unlocks Extra Attack-relevant subclass picks at level 5.
  - level: 3
    take: Bard 3
    pick:
      - Subclass — College of Swords
      - Fighting Style — Two-Weapon Fighting
      - "Expertise (×2) — Persuasion + Deception (doubles your proficiency bonus on those two)"
      - "Spell — Hold Person (the one you keep forever)"
      - "Spell — Heat Metal (great L2 damage spell, easy to forget)"
      - Slashing / Defensive / Mobile Flourish unlock
    notes: |
      The build comes alive here. Equip two finesse weapons (rapier or shortsword in
      main hand, shortsword/scimitar in off-hand). Slashing Flourish hits two enemies
      at once for one Bardic die. Defensive Flourish gives +AC. Hold Person at L3 is
      already a fight-ender against humanoids — even before Smite, your party gets
      free crits.
  - level: 4
    take: Bard 4
    pick:
      - Cantrip (gain 1) — Blade Ward or Minor Illusion
      - "ASI/Feat — skip the feat here; save it for Paladin 4 (level 10)"
      - "Spell — gain 1 and you may swap 1: drop Sleep, pick Invisibility or Enhance Ability"
    notes: |
      The feat is tempting but the build's feat slot is +2 CHA at level 10. Stay
      the course.
  - level: 5
    take: Bard 5
    pick:
      - Bardic Inspiration upgrades to d8
      - Font of Inspiration (regain Inspiration on short rest)
      - "Spell — Hypnotic Pattern (3rd level): your AoE control"
      - Extra Attack (Swords Bard exclusive)
    notes: |
      Massive power spike. You now hit twice per Action and have 3rd-level slots
      for Hypnotic Pattern. The build is genuinely strong from here on.
  - level: 6
    take: Bard 6
    pick:
      - Counter Charm (utility, vs Frightened/Charmed)
      - Final spell loadout shape — see "spells" section
    notes: |
      This is your last pure-Bard level. Multiclass starts next.
  - level: 7
    take: Paladin 1
    pick:
      - Heavy armor proficiency (DO NOT use heavy armor — it disables Bard spellcasting)
      - Lay on Hands (heal pool = 5 HP/long rest)
      - Divine Sense
    notes: |
      No spell slots from Paladin yet, but your Bard slots become Smite fuel at
      level 8.
  - level: 8
    take: Paladin 2
    pick:
      - Fighting Style — Defense (+1 AC)
      - Divine Smite unlocks
      - "Prepared spells (CHA mod + ½ Pal level): Bless, Searing Smite, Thunderous Smite"
    notes: |
      Every weapon hit can now be Divine Smited. Smite is a YES/NO choice AFTER
      you see the d20 — never pre-declare. Always smite on crits and killing blows.
  - level: 9
    take: Paladin 3
    pick:
      - Oath — Vengeance
      - "Channel Oath: Vow of Enmity — bonus action; advantage on attack rolls vs one target for 10 turns"
      - "Channel Oath: Inquisitor's Might — bonus action self-buff; your weapon attacks deal +1d4 radiant and Daze on hit for 10 turns"
      - "Oath spells (auto-prepared): Bane, Hunter's Mark"
    notes: |
      Vow of Enmity is the default Channel Oath — one bonus action, then your
      whole fight has advantage on the boss. Channel Oath has 1 charge per short
      rest; both abilities share that pool, so you pick one per fight.
  - level: 10
    take: Paladin 4
    pick:
      - "Feat / ASI — +2 CHA (15 → 17). Default pick."
    notes: |
      +2 CHA improves the spell save DC on Hold Person, the save DC on Wrathful
      Smite / Command, and the bonus from Aura of Protection at level 12. See
      "Stat Progression" for alternate feats (Resilient CON, Alert).
  - level: 11
    take: Paladin 5
    pick:
      - "Extra Attack (does not stack with Bard's; still 2 attacks per Action)"
      - "Paladin 2nd-level spells unlock — prepare Misty Step and Branding Smite"
    notes: |
      Multiclass caster level = Bard 6 + (Paladin 5 ÷ 2, rounded down) = 8, so
      your full slot table is 4 / 3 / 3 / 2 across spell levels 1–4. Level-4
      slots upcast Smites for 5d8 radiant (6d8 vs fiends/undead).
  - level: 12
    take: Paladin 6
    pick:
      - "Aura of Protection — +CHA modifier (+4 with 19 CHA) to all saves for you and allies in 9m"
    notes: |
      Build complete. The Aura makes Concentration nearly unbreakable, which means
      Hold Person stays up. You almost never lose Concentration after this level.

spells:
  cantrips:
    - { name: Vicious Mockery, source: Bard 1, why: "Psychic damage + WIS save; on fail, target has disadvantage on its next attack. Free backup ranged." }
    - { name: Friends, source: Bard 1, why: "Out-of-combat advantage on CHA checks against non-hostiles. WARNING: when it expires the target turns hostile — only use before encounters where you can leave or fight cleanly afterward, never in town." }
    - { name: Blade Ward, source: Bard 4, why: "Half damage from weapon attacks for 1 turn. Niche emergency button." }
  level_1:
    keepers:
      - { name: Faerie Fire, why: "AoE advantage on attacks. Reveals invisible. Concentration." }
      - { name: Healing Word, why: "Bonus-action revive. Mandatory on every caster." }
      - { name: Dissonant Whispers, why: "Psychic damage + WIS save; on fail target flees, eating its reaction." }
      - { name: Longstrider, why: "+3m movement on a friendly. 1-hour duration. Cast pre-fight." }
    skip:
      - { name: Sleep, why: "HP cap makes this useless past level 4." }
      - { name: Thunderwave / Color Spray, why: "Bardadin isn't AoE-focused." }
  level_2:
    keepers:
      - { name: Hold Person, why: "BUILD WIN CONDITION. Auto-crit melee on paralyzed humanoid." }
      - { name: Heat Metal, why: "Best L2 damage spell vs armored enemies; disadvantage on attacks." }
      - { name: Enhance Ability, why: "Bear's Endurance for Concentration; Eagle's Splendor for face checks." }
      - { name: Invisibility, why: "Out-of-combat positioning." }
      - { name: Silence, why: "Anti-caster, anti-Counterspell. Concentration." }
  level_3:
    keepers:
      - { name: Hypnotic Pattern, why: "Best AoE control in the game. Use when Hold Person can't cover the room." }
      - { name: Slow, why: "Big-encounter alternative to Hypnotic Pattern (hits constructs/undead, who are immune to Hypnotic Pattern's charm save)." }
      - { name: Glyph of Warding, why: "Pre-cast a damage glyph (1d8 elemental upcasted to 4d8 at L3) on a chokepoint or doorway before a fight starts. Concentration-free once placed." }
    skip:
      - { name: Counterspell, why: "Not on the Bard spell list — it's a Wizard/Sorcerer spell. Skip on Bard 6; only obtainable via Bard 10 Magical Secrets." }
      - { name: Hold Monster, why: "Level 5 spell — only available at Bard 9+ via Magical Secrets, which Swords Bard 6 cannot reach. Stick with Hold Person." }
  paladin_prepared:
    note: "Paladin spells are prepared at long rest from the full Paladin list. They share the multiclassed slot table with your Bard spells."
    recommended_at_12: [Bless, Command, Searing Smite, Thunderous Smite, Misty Step, Branding Smite]
  must_pick_now:
    - at_level: 3
      spell: "Hold Person + Heat Metal"
      why: "Hold Person is the build's win condition. Heat Metal is the best L2 damage spell vs armored enemies and is easy to overlook."
    - at_level: 5
      spell: "Hypnotic Pattern"
      why: "Best AoE control in the game. Covers fights where Hold Person can only catch one target."

gear:
  notes: >
    Heavy armor disables your Bard spellcasting. Stay in light or medium throughout,
    even after you unlock heavy armor proficiency at Paladin 1. Two finesse weapons,
    no shield.
  act_1:
    - { slot: "Main hand (early)", item: "Larethian's Wrath", where: "Crèche Y'llek — sold by A'jak'nir Jeera (the Githyanki creche quartermaster)", why: "+1 longsword (finesse) granting the Razor Gale weapon action (cone push). Solid early main-hand. Note: longsword is NOT a light weapon, so without the Dual Wielder feat you can't put it in your off-hand — keep it main-hand and dual-wield with a shortsword/dagger off-hand." }
    - { slot: "Boots", item: "Boots of Stormy Clamour", where: "Underdark — sold by Omeluum at the Myconid Colony / Ebonlake Grotto, after completing 'Help Omeluum Investigate the Parasite'", why: "Inflicting any condition stacks 2 Reverberation on the target. Pairs with Hold Person, Wrathful Smite, Phalar Aluve Shriek, etc." }
    - { slot: "Amulet", item: "Amulet of Misty Step", where: "Crèche Y'llek — sold by A'jak'nir Jeera", why: "Free Misty Step 1/short rest. Repositioning into Held targets." }
    - { slot: "Ring", item: "Caustic Band", where: "Underdark — sold by Derryth Bonecloak at the Myconid Colony / Ebonlake Grotto", why: "+2 acid damage per weapon hit. Procs on every swing of dual-wield." }
    - { slot: "Ring", item: "The Whispering Promise", where: "Goblin Camp — sold by Grat the Trader (or Volo at the Druid Grove / camp)", why: "Healing an ally grants Bless (+1d4 to attack rolls and saves) to both for 3 turns. Synergizes with Healing Word." }
    - { slot: "Armor", item: "Adamantine Scale Mail", where: "Grymforge — craft at the Adamantine Forge with mithral ore + scale mail mould", why: "Medium armor (no spellcast penalty), immune to crits, reflects crits as Stun." }
    - { slot: "Off-hand carry", item: "Phalar Aluve", where: "Selûnite Outpost in the Underdark — pull from the rock (DC 15 Strength)", why: "Carry in inventory or off-hand for the toggleable Sing aura (+1d4 to attack rolls and saves to allies in 6m) or Shriek aura (vulnerability to next damage instance for enemies in 6m). Shriek is the build's hidden multiplier — toggle on before any nova round." }
    - { slot: "Boots (alt)", item: "Disintegrating Night Walkers", where: "Grymforge — looted from Nere's body after the Duergar fight (Act 1 endgame)", why: "Misty Step 1/short rest, immunity to Web/Ensnared. The Bardadin's BiS boots — and they drop in Act 1, not Act 3 like many sources suggest." }
    - { slot: "Helm (alt)", item: "Diadem of Arcane Synergy", where: "Crèche Y'llek — Inquisitor's Chamber, carried by Ardent Jhe'rezath", why: "When you inflict ANY condition (Hold Person, Faerie Fire, Frighten, Daze, Reverberation), you gain Arcane Synergy: +CHA mod to weapon damage for 2 turns. Picks up early, scales with the build's whole identity." }
    - { slot: "Gloves (alt)", item: "Gloves of Belligerent Skies", where: "Crèche Y'llek — elegant chest in the Inquisitor's Chamber", why: "Whenever you deal Radiant, Lightning, or Thunder damage, the target takes 2 stacks of Reverberation per damage instance. Combines with Wrathful Smite (radiant) and Inquisitor's Might (radiant)." }
    - { slot: "Gloves (alt)", item: "Wondrous Gloves", where: "Grymforge — looted from a Mimic near the Harper cache", why: "+1 Bardic Inspiration / Flourish charge per short rest, +1 AC. Effectively a 5th Inspiration slot." }
  act_2:
    - { slot: "Off-hand weapon", item: "Drakethroat Glaive", where: "Moonrise Towers — sold by Roah Moonglow", why: "Drakethroat Glaive itself is a glaive (two-handed; not your weapon), but its 1/long rest cast 'Elemental Weapon' lets you imbue ANOTHER weapon with +1 attack/damage and +1d4 elemental. Cast it on your off-hand dagger or shortsword to upgrade it before a long fight." }
    - { slot: "Armor", item: "Luminous Armour", where: "Selûnite Outpost (Shadow-Cursed Lands) — locked & trapped opulent chest behind a hidden door", why: "Medium armor. When you deal radiant damage, all nearby enemies get 2 turns of Radiating Orb (–1 to attack rolls, stacking)." }
    - { slot: "Ring", item: "Risky Ring", where: "Moonrise Towers — sold by Araj Oblodra (relocates to Crimson Draughts in the Lower City for Act 3 if missed)", why: "Advantage on all attack rolls (and disadvantage on saving throws). Bardic Inspiration offsets the saves penalty in clutch moments." }
    - { slot: "Ranged weapon", item: "Ne'er Misser", where: "Zhentarim Hideout (Act 1) or Roah Moonglow (Moonrise Towers, Act 2)", why: "Hand crossbow, +1d8 force on hit, Magic Missile 1/short rest. Carry as a ranged option." }
    - { slot: "Amulet (alt)", item: "Spellcrux Amulet", where: "Moonrise Towers Prison — worn by the Warden", why: "Once per long rest, regain a spell slot of any level. Effectively a free big Smite per day. Light Act 2 alt to Greater Health (which is Act 3)." }
    - { slot: "Ring (situational)", item: "Coruscation Ring", where: "Last Light Inn cellar — trapped heavy chest in the secret area past the Meenlocks", why: "Spells with saves apply Radiating Orb on hit. Strong only if you commit to a full radiant-stack theme (Luminous Armour + Holy Lance Helm + Callous Glow). Vengeance Bardadin gets some value, but Risky Ring is the better generic pick." }
  act_3:
    - { slot: "Main hand", item: "Bloodthirst", where: "Bhaal Temple — looted from Orin's body at the end of 'Get Orin's Netherstone'", why: "+1 dagger with two big riders: Improved Critical (-1 crit threshold — crits on 19/20 by default) and Exploit Weakness (your melee attack inflicts Vulnerability to Piercing on the target on hit). Stack with Bhaalist Armour for a 4× damage multiplier on piercing." }
    - { slot: "Off-hand", item: "Rhapsody", where: "Cazador's vault — looted after killing Cazador in his palace", why: "+1 dagger; for every kill you score with it (up to 3 stacks), you gain +1 to attack rolls, weapon damage, AND spell save DC. Stacks last until long rest. Build-defining off-hand." }
    - { slot: "Armor", item: "Bhaalist Armour", where: "Bhaal Temple — sold by the Echo of Abazigal at the Murder Tribunal after impressing them", why: "Aura of Murder (3m / 10ft radius) — nearby enemies take Piercing damage as if Vulnerable (effectively double piercing damage). Doubles every dagger swing in melee. Light armor — Bards qualify." }
    - { slot: "Helm", item: "Helmet of Arcane Acuity", where: "Lower City — locked & trapped Gilded Chest in the secret basement under the Mason's Guild", why: "Each weapon hit grants 1 stack of Arcane Acuity (max 10). Each stack = +1 to your spell save DC and spell attack rolls. Stacks decay 1 per turn at start of turn and lose 2 stacks when you take damage. Combine with Band of the Mystic Scoundrel: hit twice → +2 DC → bonus-action Hold Person at boosted DC. Build-defining." }
    - { slot: "Helm (alt)", item: "Birthright", where: "Sorcerous Sundries — sold by Lorroakan's projection (or Rolan once he runs the shop)", why: "+2 CHA (caps at 22). Take this if your CHA is already 18+ and you've stockpiled enough Acuity from elsewhere — extra CHA scales Aura of Protection, save DC, and Smite-spell DCs." }
    - { slot: "Gloves", item: "Helldusk Gloves", where: "House of Hope — looted from Haarlep in the Boudoir", why: "Infernal Acuity (+1 spell save DC and attack rolls), Infernal Touch (weapons deal +1d6 fire on hit), Rays of Fire 1/short rest, +1 STR save. (Note: no Lightning Bolt and no Fly — those are on Helldusk Armour, not the gloves.)" }
    - { slot: "Amulet", item: "Amulet of Greater Health", where: "House of Hope — left-most pedestal in the Archive", why: "Sets CON to 23 (mod +6). Frees your stat array AND gives +6 to Concentration saves. Mandatory for keeping Hold Person up." }
    - { slot: "Ring", item: "Band of the Mystic Scoundrel", where: "Circus of the Last Days in Rivington — win Akabi's spin-the-wheel game to be teleported to the Jungle area; the ring is in a backpack. One party member only per spin. Alts: pickpocket Akabi's Djinni Ring, or pass Bard-only skill checks.", why: "After a successful weapon attack, cast an Enchantment OR Illusion spell as a BONUS ACTION. Hold Person → bonus action. The keystone of the build." }
    - { slot: "Cloak", item: "Cloak of Protection", where: "Last Light Inn — sold by Quartermaster Talli", why: "+1 AC and +1 to all saves. Always good." }
    - { slot: "Ring (situational)", item: "Callous Glow Ring", where: "Gauntlet of Shar — opulent chest in the vault room near Balthazar", why: "+2 radiant damage to illuminated targets. Niche outside a full radiant-stack." }
    - { slot: "Cloak (alternate)", item: "Cloak of Displacement", where: "Wyrm's Crossing — sold by Entharl Danthelon at Danthelon's Dancing Axe", why: "Attack rolls against you have disadvantage while at full HP. Defensive alternative when you don't need the Cloak of Protection saves." }
  bis_at_12:
    main_hand: Bloodthirst
    off_hand: Rhapsody
    armor: Bhaalist Armour
    helm: Helmet of Arcane Acuity (or Diadem of Arcane Synergy if you've already capped Acuity from elsewhere)
    gloves: Helldusk Gloves
    boots: Disintegrating Night Walkers (acquired in Act 1 — wear from then on)
    cloak: Cloak of Protection
    amulet: Amulet of Greater Health
    ring_1: Band of the Mystic Scoundrel
    ring_2: Risky Ring (or Callous Glow Ring for the radiant theme)

alternative_splits:
  intro: |
    The Bardadin community is split on the right level distribution. Most published
    guides recommend Bard 10 / Paladin 2 — this guide takes the Bard 6 / Paladin 6
    minority view, deliberately. Here are the realistic alternatives so you can
    decide whether to follow this guide or pivot.
  options:
    - name: Bard 6 / Paladin 6 (this guide)
      gives:
        - "Aura of Protection at Pal 6 — +CHA mod (+4 with 19 CHA, +5 with 20) to ALL party saves within 9m. The single biggest party-defense buff in the game."
        - "Vengeance oath features at Pal 3-6: Vow of Enmity, Inquisitor's Might, Relentless Avenger (Pal 7 — not reached here)."
        - "Stronger Concentration baseline thanks to Aura of Protection covering CON saves."
      gives_up:
        - "Magical Secrets at Bard 10 — no Banishing Smite, Counterspell, Spirit Guardians, or Conjure Elemental."
        - "Bard L4 spells (Confusion, Greater Invisibility) and L5 spells (Hold Monster). Hold Person only works on humanoids."
        - "1 fewer Bardic Inspiration use per short rest."
      best_for: Party leaders, support-leaning players, parties without another Charisma face/saver.
    - name: Bard 10 / Paladin 2
      gives:
        - "Magical Secrets at Bard 10 — pick Banishing Smite (5d10 force on next hit) and one of Counterspell / Spirit Guardians / Conjure Elemental."
        - "Bard L5 spell slots — fuel bigger Smites and Hold Monster."
        - "Higher single-target nova ceiling and more Bardic Inspiration uses."
      gives_up:
        - "Aura of Protection — your Concentration relies on Resilient (CON), War Caster, or the Amulet of Greater Health alone."
        - "Pal 3+ oath features. You only have base Smite and 1 fighting style."
      best_for: Solo-DPS-leaning players, optimization purists, Honor Mode runners.
    - name: Paladin 7 / Bard 5
      gives:
        - "Aura of Protection (Pal 6) AND Pal 7 Oath features — Vengeance gets Relentless Avenger (free movement on attack of opportunity)."
        - "Two extra attack opportunities at character L5 onward (Pal 5 Extra Attack)."
      gives_up:
        - "Bard 6 Counter Charm and the 4th Bardic Inspiration use."
        - "Hypnotic Pattern at Bard 5 still works, but you reach it later."
      best_for: Players who want a full paladin feel with bardic support on the side.
    - name: Shadow Blade Bardadin (Bard 6 / Sorcerer 4 / Paladin 2)
      gives:
        - "Shadow Blade — a 4d8 psychic finesse weapon summoned via L5 sorcerer slot. Pairs with Resonance Stone (psychic doubler) for absurd damage."
        - "Sorcerer L1 = CON saves proficiency for free. Solves Concentration problem without a feat."
      gives_up:
        - "Aura of Protection. Inquisitor's Might. Most party-support tools."
        - "More complex multiclass juggle and respec timing."
      best_for: Players who already finished one Bardadin run and want a higher-ceiling variant.

race_choice:
  locked_for_you: Wood Elf
  why_its_fine: |
    Wood Elf is competitive, not optimal. +2 DEX maps cleanly to dual-wield finesse,
    Fleet of Foot adds 1.5m movement (great for melee positioning), Mask of the
    Wild gives stealth advantage in natural terrain, and Darkvision saves a
    cantrip slot. You give up Half-Orc Savage Attacks (extra crit die) but the
    build's gear progression more than compensates.
  community_meta_picks:
    - { race: "Half-Orc", upside: "Savage Attacks adds an extra crit die — directly multiplies Hold Person and Reverberation crit-fishing damage." }
    - { race: "Half-Elf (Wood or High)", upside: "Charisma-themed race with three skill picks. High Half-Elf gets Booming Blade as a free cantrip (extra ranged option)." }
    - { race: "Seldarine Drow", upside: "Free Faerie Fire and Darkness 1/long rest each. Faerie Fire is your reliable advantage source pre-Hold-Person." }
    - { race: "Zariel Tiefling", upside: "Free Searing Smite (L1 spell) and Branding Smite (L3 spell). Pure smite economy." }
  takeaway: "If you're locked into Wood Elf you lose roughly one crit die's worth of damage on nova rounds. You make it back via Bhaalist Armour, Acuity, and the Hag's Hair / Mirror of Loss CHA stacking."

playstyle:
  early:
    levels: "1 – 6 (pure Bard)"
    summary: |
      Levels 1–2 you play as a back-line caster: ranged hand crossbow + Vicious
      Mockery, Healing Word for emergencies. From Bard 3 onward you're a melee
      face/skill character with a finesse dual-wield package — Slashing Flourish
      to cleave, Faerie Fire and Hold Person for control. Extra Attack lands at
      Bard 5.
    standard_turn: |
      Action — 1 attack at L3, 2 attacks at L5+, plus Slashing Flourish to hit a
      second target on the same swing. Bonus action — off-hand attack (Two-Weapon
      Fighting adds your DEX mod to off-hand damage). Reaction — hold for Cutting
      Words on a big incoming attack.
    nova_turn: |
      Round 1 — Faerie Fire on a clump (advantage for your whole party). Round 2
      — Hold Person on the priority target. Round 3 — melee on the held target;
      every hit auto-crits.
  mid:
    levels: "7 – 9 (Paladin 1–3)"
    summary: |
      Smite unlocks at L8. Vow of Enmity at L9. You're now picking spell slots
      between "cast Hold Person" and "save for big Smite."
    standard_turn: |
      Action: 2 attacks. Bonus action: off-hand + Vow of Enmity (one or the other —
      Vow on round 1, off-hand thereafter). Decide post-hit whether to Smite. Crits
      ALWAYS get smited. Killing blows usually get smited.
    nova_turn: |
      Round 1: Vow of Enmity (bonus) + Hold Person (action, L2 slot) on the boss.
      Round 2: 2 attacks at advantage AND auto-crit (Held). Smite both with L1+ slots —
      dice double on crit. Off-hand also crits. ~80–120 damage round.
  late:
    levels: "10 – 12 (Paladin 4–6)"
    summary: |
      Aura of Protection makes Concentration nearly unbreakable. Band of the Mystic
      Scoundrel collapses the setup-to-payoff window into a single round.
    standard_turn: |
      With Mystic Scoundrel: Action — 2 attacks (the first should hit, that's the
      trigger). Bonus action — Hold Person/Hold Monster. Next turn detonate.
    nova_turn: |
      Pre-fight: Bless (scroll or party) + Phalar Aluve Sing buff. Round 1: hit
      with main-hand → Arcane Acuity stacks → bonus-action Hold Person on boss.
      Round 2: 2 main-hand attacks + 1 off-hand, all auto-crit. Smite with L2/L3 slots
      — easily 150–250 damage in a single round, plus Bhaalist piercing aura, plus
      Holy Lance / Radiating Orb stacks shutting down everything else nearby.

abilities_situational:
  - name: Slashing Flourish
    when: "2+ enemies clumped within 1.5m. Especially good when both are <50% HP."
    cost: 1 Bardic Inspiration
    notes: "Default Flourish use. Spend Inspiration on this proactively."
  - name: Defensive Flourish
    when: "You're being focused and need AC. Use when surrounded."
    cost: 1 Bardic Inspiration
  - name: Mobile Flourish
    when: "Push an enemy off a ledge or into Spike Growth / hazards."
    cost: 1 Bardic Inspiration
  - name: Cutting Words
    when: "REACT — only when an enemy rolls a near-miss attack against you/an ally, or a critical save."
    cost: 1 Bardic Inspiration
    notes: "Reserve 1 Inspiration per fight as your emergency button."
  - name: Hold Person
    when: "Humanoid boss. The trigger to your auto-crit chain."
    not: "Undead, constructs, fiends, beasts, elementals — they're immune. Plan around them with Faerie Fire + Vow."
  - name: Faerie Fire
    when: "Group of enemies, especially if any are invisible/obscured. Or when Hold Person is illegal (constructs, undead)."
    notes: "Concentration. Drops if you Hold Person later."
  - name: Dissonant Whispers
    when: "Single dangerous caster — the WIS save fail eats their reaction (Counterspell, Shield, Reaction-AoO). Or to push a target through Spike Growth."
  - name: Vow of Enmity
    when: "Round 1 of any boss fight where Hold Person is illegal (undead, constructs, fiends, beasts) — bonus-action advantage on all attacks vs the target for 10 turns."
    notes: "Channel Oath, 1 charge per short rest. Shares the charge with Inquisitor's Might — pick one per fight. The advantage is redundant once Hold Person lands (Held = auto-crit already), so against humanoids, lead with Hold Person and save Vow for the next fight."
  - name: Inquisitor's Might
    when: "Long, multi-turn fights against Hold-Person-immune enemies (Steel Watchers, undead bosses). Bonus-action self-buff for 10 turns: +1d4 radiant on weapon attacks and a chance to Daze on hit."
    not: "Concentration. Casting it BREAKS Hold Person, Faerie Fire, or any other concentration spell you already had up. Treat it as an alternative to Hold Person, never an addition."
    notes: "Shares its Channel Oath charge with Vow of Enmity — 1 use per short rest, pick one. Don't burn it on 2-round trash fights."
  - name: Divine Smite
    when: "After a confirmed hit. Always on crits. Always on killing blows. Hold the slot if <2 left and the fight has multiple bosses remaining."
    notes: "BG3 lets you choose post-hit. Never pre-declare."
  - name: Lay on Hands
    when: "Out of combat or emergency in-combat heal. 5 HP/long rest pool — small but free of slots."

mistakes_and_tips:
  - "DO NOT start as Paladin if going for the 6/6 split. Bard's first level locks in Bard saving throw proficiencies (DEX + CHA) which Paladin doesn't grant. Paladin-first also delays Extra Attack to character level 7 instead of 5."
  - "DO NOT respec to Paladin too early. Stay pure Bard until 6. Going Paladin at 5 delays Extra Attack and L3 spells."
  - "DO NOT equip heavy armor — it disables Bard spellcasting. Stay in light or medium even after Paladin 1."
  - "Inquisitor's Might IS Concentration. Casting it breaks Hold Person, Faerie Fire, or any other concentration you had up. Treat it as an alternative to Hold Person, never an addition."
  - "The Friends cantrip turns the target hostile when it expires. Never use it on shopkeepers, in town, or before a dialogue you might need to revisit. Bonus dialogue advantage is not worth a free fight."
  - "Two-Weapon Fighting style adds your ability mod to off-hand damage. Confirm you took it as your Bard 3 Fighting Style — at Bard 3 you choose Subclass + Style at the same level-up screen."
  - "Smite is decided AFTER the d20 rolls. Never pre-declare. Always smite on crits (dice double) and killing blows."
  - "Hold Person doesn't work on undead, constructs, elementals, fiends, beasts. Most Act 2 (shadow undead) and Act 3 (Steel Watchers, demons) bosses are immune. Use Faerie Fire + Vow of Enmity for those fights — and consider swapping in Inquisitor's Might (concentration alternative)."
  - "Concentration: Hold Person breaks if you take a hit and fail a CON save (DC = half the damage taken, minimum 10). Aura of Protection (L12) + Amulet of Greater Health (CON 23) makes this nearly impossible."
  - "Pickpocket Lann Tarv early in Act 2 to grab the Helmet of Arcane Acuity without paying. Quicksave first; if caught, reload."
  - "The Band of the Mystic Scoundrel only triggers if your weapon attack HITS. Lead the round with a high-hit-chance attack (Vow of Enmity advantage, Bless, or against a low-AC mob) so you have a guaranteed trigger before going for the boss spell."
  - "Bard 6 = 4 Inspirations per short rest. Take 2 short rests between long rests. Don't hoard them across fights — use it or lose it on long rest."
  - "Vendor inventories restock on level up. After leveling in camp, revisit Lann Tarv, Dammon, A'jak'nir Jeera, and Roah for fresh stock."
  - "Wood Elf Fleet adds 1.5m movement. Use it for melee positioning instead of burning Misty Step."
